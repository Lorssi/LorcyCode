[project]
name = "lorcy_code"
version = "0.1.0"
description = "Terminal-based AI coding agent with skills, tools, sessions, and Git checkpoints"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "questionary>=2.1.0",
    "prompt-toolkit>=3.0.0",
    "aiosqlite>=0.22.1",
    "bs4>=0.0.2",
    "langchain>=1.2.10",
    "langchain-openai>=1.1.10",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "tavily>=1.1.0",
    "charset-normalizer>=3.4.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
    "markdownify>=0.14.0",
    "aiofiles>=25.1.0",
    "psutil>=6.0.0",
    "pillow>=12.2.0",
    # wk2 dependencies
    "langchain-community>=0.4.1",
    "dataclasses-json>=0.6.7",
    "faiss-cpu>=1.13.2",
    "transformers>=4.57.0",
    "torch>=2.7.1",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.1",
    "tqdm>=4.67.1",
    "scikit-learn>=1.7.2",
    "pandas>=2.3.3",
    "numpy>=2.1.3",
]


[project.scripts]
lorcy_code = "lorcy_code.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0", "typer>=0.15.0"]

# PyTorch GPU 版本配置（从第一个文件合并）
[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"  # 清华源（默认）
default = true

[[tool.uv.index]]
url = "https://pypi.org/simple/"                  # 官方源（备选）
[project]
name = "lorcy_code"
version = "0.1.0"
description = "Terminal-based AI coding agent with skills, tools, sessions, and Git checkpoints"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "questionary>=2.1.0",
    "prompt-toolkit>=3.0.0",
    "aiosqlite>=0.22.1",
    "bs4>=0.0.2",
    "langchain>=1.2.10",
    "langchain-openai>=1.1.10",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "tavily>=1.1.0",
    "charset-normalizer>=3.4.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
    "markdownify>=0.14.0",
    "aiofiles>=25.1.0",
    "psutil>=6.0.0",
    "pillow>=12.2.0",
]

[project.scripts]
lorcy_code = "lorcy_code.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0", "typer>=0.15.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"  # 清华源（默认）
default = true

[[tool.uv.index]]
url = "https://pypi.org/simple/"                  # 官方源（备选）
